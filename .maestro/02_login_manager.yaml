appId: com.example.expense_tracking_prd
---
- launchApp
- runFlow:
    when:
      notVisible: "Email"
    commands:
      - tapOn: "Profile"
      - tapOn: "Sign Out"
      - tapOn: "Sign Out"
- tapOn: "Email"
- inputText: "manager@example.com"
- tapOn: "Password"
- inputText: "password"
- tapOn: "Sign In to GW project"
- extendedWaitUntil:
    visible: "GW Project Financials"
    timeout: 10000
- assertVisible: "GW Project Financials"
- tapOn: "Expenses"
- assertVisible: "Approve Expenses"
- tapOn: "Attendance"
- assertVisible: "Team Attendance"
- tapOn: "Projects"
- assertVisible: "Manage Projects"
- tapOn: "Profile"
- tapOn: "Sign Out"
- tapOn: "Sign Out"
